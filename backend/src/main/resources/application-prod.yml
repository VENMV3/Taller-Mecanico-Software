spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: false
  hikari:
    maximum-pool-size: 3
    minimum-idle: 1
    max-lifetime: 300000
    connection-timeout: 30000

server:
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${CORS_ORIGINS}
  upload-dir: ${UPLOAD_DIR}
